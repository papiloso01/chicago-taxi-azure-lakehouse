name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python tools/validate_metadata.py
      - run: python -m pytest tests/functional -v --junitxml=test-results/functional.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: test-results/
