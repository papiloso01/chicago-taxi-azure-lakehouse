name: Lakehouse checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, integration, etl_validation, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[test,spark-test]'
      - name: Download pinned WireMock
        if: matrix.suite == 'integration'
        run: python tools/download_wiremock.py
      - run: python tools/validate_metadata.py
      - name: Run suite
        shell: bash
        run: |
          args=()
          if [ "${{ matrix.suite }}" = "integration" ]; then
            args+=(--wiremock-jar .tools/wiremock.jar)
          fi
          python -m pytest tests/${{ matrix.suite }} -v "${args[@]}" --junitxml=test-results/${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: test-results/
