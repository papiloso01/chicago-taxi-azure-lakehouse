name: Lakehouse checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: test-results/coverage-data
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, integration, etl_validation, e2e, delta_integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[test,spark-test]'
      - name: Download pinned WireMock
        if: matrix.suite == 'integration'
        run: python tools/download_wiremock.py
      - name: Download pinned Delta test JARs
        if: matrix.suite == 'delta_integration'
        run: python tools/download_delta.py
      - run: python tools/validate_metadata.py
      - name: Run suite
        shell: bash
        run: |
          args=()
          if [ "${{ matrix.suite }}" = "integration" ]; then
            args+=(--wiremock-jar .tools/wiremock.jar)
          fi
          python -m coverage run -m pytest tests/${{ matrix.suite }} -v "${args[@]}" --junitxml=test-results/${{ matrix.suite }}.xml
      - name: Report suite coverage
        if: always()
        run: python tools/coverage_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: test-results/

  coverage-summary:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'coverage>=7.10,<8'
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-*
          path: coverage-reports
      - run: python tools/coverage_report.py --input-dir coverage-reports --output-dir test-results
      - uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: test-results/
