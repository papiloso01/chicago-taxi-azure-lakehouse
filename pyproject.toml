[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-taxi-azure-lakehouse"
version = "0.1.0"
description = "Azure Data Factory and Databricks serverless taxi lakehouse"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
