version: 2.1
jobs:
  functional:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: python -m pip install -e '.[test]'
    - run: python tools/validate_metadata.py
    - run: python -m pytest tests/functional -v --junitxml=test-results/functional.xml
    - store_test_results:
        path: test-results
  integration:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: python -m pip install -e '.[test]'
    - run: python tools/validate_metadata.py
    - run: python -m pytest tests/integration -v --junitxml=test-results/integration.xml
    - store_test_results:
        path: test-results
  etl_validation:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - run: python -m pip install -e '.[test,spark-test]'
      - run: python -m pytest tests/etl_validation -v --junitxml=test-results/etl_validation.xml
      - store_test_results:
          path: test-results
  e2e:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - run: python -m pip install -e '.[test,spark-test]'
      - run: python -m pytest tests/e2e -v --junitxml=test-results/e2e.xml
      - store_test_results:
          path: test-results
workflows:
  lakehouse:
    jobs:
      - functional
      - integration:
          requires: [functional]
      - etl_validation:
          requires: [functional]
      - e2e:
          requires: [functional]
