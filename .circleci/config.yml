version: 2.1
jobs:
  functional:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: python -m pip install -e '.[test,spark-test]'
    - run: python tools/validate_metadata.py
    - run: python -m coverage run -m pytest tests/functional -v --junitxml=test-results/functional.xml
    - run:
        command: python tools/coverage_report.py
        when: always
    - store_artifacts:
        path: test-results
    - store_test_results:
        path: test-results
    environment:
      COVERAGE_FILE: test-results/coverage-data
  integration:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
    - run: python tools/download_wiremock.py
    - run: python -m pip install -e '.[test]'
    - run: python tools/validate_metadata.py
    - run: python -m coverage run -m pytest tests/integration -v --wiremock-jar .tools/wiremock.jar
        --junitxml=test-results/integration.xml
    - run:
        command: python tools/coverage_report.py
        when: always
    - store_artifacts:
        path: test-results
    - store_test_results:
        path: test-results
    environment:
      COVERAGE_FILE: test-results/coverage-data
  etl_validation:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
    - run: python -m pip install -e '.[test,spark-test]'
    - run: python -m coverage run -m pytest tests/etl_validation -v --junitxml=test-results/etl_validation.xml
    - run:
        command: python tools/coverage_report.py
        when: always
    - store_artifacts:
        path: test-results
    - store_test_results:
        path: test-results
    environment:
      COVERAGE_FILE: test-results/coverage-data
  e2e:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
    - run: python -m pip install -e '.[test,spark-test]'
    - run: python -m coverage run -m pytest tests/e2e -v --junitxml=test-results/e2e.xml
    - run:
        command: python tools/coverage_report.py
        when: always
    - store_artifacts:
        path: test-results
    - store_test_results:
        path: test-results
    environment:
      COVERAGE_FILE: test-results/coverage-data
  delta_integration:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
    - run: python -m pip install -e '.[test,spark-test]'
    - run: python tools/download_delta.py
    - run: python -m coverage run -m pytest tests/delta_integration -v --junitxml=test-results/delta_integration.xml
    - run:
        command: python tools/coverage_report.py
        when: always
    - store_artifacts:
        path: test-results
    - store_test_results:
        path: test-results
    environment:
      COVERAGE_FILE: test-results/coverage-data
workflows:
  lakehouse:
    jobs:
    - functional
    - integration:
        requires:
        - functional
    - etl_validation:
        requires:
        - functional
    - e2e:
        requires:
        - functional
    - delta_integration:
        requires:
        - functional
