version: 2.1
jobs:
  functional:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python -m pip install -e '.[test]'
      - run: python tools/validate_metadata.py
      - run: python -m pytest tests/functional -v --junitxml=test-results/functional.xml
      - store_test_results:
          path: test-results
workflows:
  foundation:
    jobs:
      - functional
